<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rayflix Math Solver</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <style>
    #preview-img { max-height: 300px; display: none; }
    canvas { display: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-blue-100 min-h-screen flex items-center justify-center text-gray-800">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-2xl border border-gray-200">
    <h1 class="text-4xl font-extrabold text-center mb-6 text-blue-700">Rayflix Math Solver</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Upload Math Image (Required)</label>
      <input type="file" accept="image/*" id="imageInput" class="w-full border p-2 rounded" />
    </div>

    <div class="mb-4">
      <img id="preview-img" class="rounded shadow" />
    </div>

    <button onclick="cropImage()" class="w-full mb-6 bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600">Crop Image</button>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Optional Text Input</label>
      <textarea id="manualText" rows="3" placeholder="e.g. Solve: x^2 - 4 = 0" class="w-full border p-2 rounded"></textarea>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Select Language</label>
      <select id="language" class="w-full border p-2 rounded">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Bengali">Bengali</option>
        <option value="Spanish">Spanish</option>
      </select>
    </div>

    <button onclick="uploadAndSolve()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700">Solve with Kaustav AI</button>

    <div id="output" class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-base whitespace-pre-wrap shadow-inner min-h-[100px]"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let cropper;
    let croppedBase64 = "";

    const imageInput = document.getElementById('imageInput');
    const previewImg = document.getElementById('preview-img');

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImg.src = URL.createObjectURL(file);
        previewImg.style.display = 'block';
        if (cropper) cropper.destroy();
        previewImg.onload = () => {
          cropper = new Cropper(previewImg, {
            aspectRatio: NaN,
            viewMode: 1
          });
        };
      }
    });

    function cropImage() {
      if (cropper) {
        const canvas = cropper.getCroppedCanvas();
        croppedBase64 = canvas.toDataURL('image/jpeg').split(',')[1];
        alert("Image cropped & ready!");
      } else {
        alert("Please upload and crop the image first!");
      }
    }

    async function uploadAndSolve() {
      const manualText = document.getElementById('manualText').value.trim();
      const lang = document.getElementById('language').value;
      const output = document.getElementById('output');

      if (!croppedBase64) {
        output.innerText = "Please crop the image before solving.";
        return;
      }

      output.innerText = "Kaustav AI working on the math....";

      let prompt = `Solve the math problem in this image and explain it in ${lang}.`;
      if (manualText) {
        prompt += ` Also consider this text: ${manualText}`;
      }

      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyAgIPiDW0xo05XEX1De4VWVYJmWCOWartU", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: croppedBase64 } }
            ]
          }]
        })
      });

      const result = await response.json();
      const reply = result?.candidates?.[0]?.content?.parts?.[0]?.text || "Something went wrong bro!";
      output.innerText = reply;
    }
  </script>
</body>
</html>
