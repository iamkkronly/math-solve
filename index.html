<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rayflix Math Solver</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gradient-to-br from-gray-100 to-blue-100 min-h-screen flex items-center justify-center text-gray-800">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-2xl border border-gray-200">
    <h1 class="text-4xl font-extrabold text-center mb-6 text-blue-700">Rayflix Math Solver</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Upload Math Image (Required)</label>
      <input type="file" accept="image/*" id="imageInput" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400" required/>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Optional Text Input (e.g. “Solve: x² - 4 = 0”)</label>
      <textarea id="manualText" rows="3" placeholder="Write any math problem here..." class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400"></textarea>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Select Language</label>
      <select id="language" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Bengali">Bengali</option>
        <option value="Spanish">Spanish</option>
      </select>
    </div>

    <button onclick="uploadAndSolve()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition-all">
      Solve with Kaustav AI
    </button>

    <div id="output" class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-base whitespace-pre-wrap shadow-inner min-h-[100px]"></div>
  </div>

  <script>
    async function uploadAndSolve() {
      const imageInput = document.getElementById('imageInput');
      const manualText = document.getElementById('manualText').value.trim();
      const lang = document.getElementById('language').value;
      const output = document.getElementById('output');

      output.innerText = "Processing... Please wait while Kaustav AI analyzes your input.";

      if (!imageInput.files.length) {
        output.innerText = "Please upload a math image to continue.";
        return;
      }

      const file = imageInput.files[0];
      const reader = new FileReader();

      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];

        let prompt = `Solve the math problem in this image and explain it clearly in ${lang}.`;
        if (manualText) {
          prompt += ` Also consider this text: ${manualText}`;
        }

        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyAgIPiDW0xo05XEX1De4VWVYJmWCOWartU", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64 } }
              ]
            }]
          })
        });

        const result = await response.json();
        const reply = result?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, something went wrong. Please try again.";
        output.innerText = reply;
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
